[project]
name = "curriculumos"
version = "0.1.0"
description = "Grounded, citable term planning that replans itself when the calendar changes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "httpx>=0.27",
    "openai>=1.54",
    "pypdf>=5.0",
    "pillow>=10.0",  # pypdf page.images, for the vision-LLM OCR parser
    "python-multipart>=0.0.9",
    "ortools>=9.11",
]

[project.optional-dependencies]
cloud = [
    "anthropic>=0.40",
]
parsing = [
    "docling>=2.0",
    "firecrawl-anydoc>=0.2",
]
workers = [
    "celery[redis]>=5.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "sqlalchemy[mypy]",
]
full = [
    "anthropic>=0.40",
    "celery[redis]>=5.4",
    "docling>=2.0",
    "firecrawl-anydoc>=0.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: Depends()/Form()/File() in function defaults is idiomatic FastAPI
# BLE001: intentional catch-all for provider fallback routing
# TRY004: ValueError is correct for business-logic validation here
ignore = ["B008", "BLE001", "TRY004", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ortools.*", "pgvector.*", "docling.*", "firecrawl_anydoc.*", "celery.*", "openai.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
