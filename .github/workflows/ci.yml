name: Validate EduFlow
on: [push, pull_request]

jobs:
  next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eduflow-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eduflow-next/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
